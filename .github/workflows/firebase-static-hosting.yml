name: Deploy Firebase Hosting Static SEO

# NOTE: GitHub only reads workflows from .github/workflows at the *repository
# root*. A copy under OMP-PRD-main/.github/workflows/ is never executed — that
# is why the full build pipeline (build.py + origin normalization + sitemap
# regeneration) never ran and the site shipped with truncated sitemaps and
# canonicals pointing at a dead domain. Keep this file the single workflow.

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

# Manual runs only. This workflow used to fire on every push and pull request,
# spending Actions minutes on every commit even when nothing needed deploying.
# Deploys now run through the Firebase CLI, which is free on the Spark plan, so
# the gate is opt-in: dispatch it from the Actions tab when you want the full
# regression suite before a deploy.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SUPABASE_URL: https://aeehfulikupskyrvcpzb.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_s3n2U32MNB4PvHx0GolyqA_wlkzD6eR
  SITE_ORIGIN: https://oopsmypassword.web.app
  FIREBASE_PROJECT_ID: password-e9a30
  # Retired apex domain. It does not resolve, so any canonical or sitemap URL
  # pointing at it keeps that page out of the index. Consumed by
  # scripts/verify-seo.mjs, which fails the deploy if it appears anywhere.
  LEGACY_ORIGIN: https://oopsmypassword.com

jobs:
  academy-regression:
    name: Academy backend, concurrency and browser regressions
    # ADVISORY, not a deploy gate. This suite currently fails on main before it
    # reaches a single test: `deno check` rejects the Academy Edge Functions.
    # That is a pre-existing type error, unrelated to what Hosting ships, and
    # blocking every deploy on it is how the site went stale. Keep it running
    # for signal; move it back into the deploy job's `needs:` once it is green.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OMP-PRD-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: OMP-PRD-main/tools/qa-deps/package-lock.json
      - name: Install pinned publishing dependencies
        working-directory: OMP-PRD-main
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install and audit pinned optional Firebase handlers
        run: |
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm audit --prefix functions --omit=dev --audit-level=high

      - name: Install pinned QA dependencies
        run: |
          npm ci --prefix tools/qa-deps --no-audit --no-fund
          echo "NODE_PATH=$PWD/tools/qa-deps/node_modules" >> "$GITHUB_ENV"
          tools/qa-deps/node_modules/.bin/playwright install --with-deps chromium
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Academy Edge Functions
        run: deno check --node-modules-dir=none --no-lock supabase/functions/learning-progress/index.ts supabase/functions/learning-quiz-submit/index.ts supabase/functions/learning-certificate-verify/index.ts supabase/functions/newsletter/index.ts
      - name: Database and publishing regression gate (no live services)
        run: |
          node tools/test_academy_backend.js
          node tools/test_academy_concurrency.js
          node tools/test_academy_migrations.js
          node tools/test_academy_course_database.js
          node tools/test_academy_multisubject.mjs
          node tools/test_academy_local.mjs
          node tools/test_newsletter.js
          node tools/test_site_contracts.js
          node tools/test_site_database.js
          node tools/test_functions.cjs
          node tools/products_app_harness.js
          node tools/admin_products_harness.js
          node tools/test_release_verifier.mjs
          node tools/audit_academy_publishing.mjs
          python3 tools/test_academy_content.py
          node tools/test_academy_build.mjs
      - name: Browser and general runtime gate
        run: |
          node scripts/build-academy.mjs --snapshot
          node tools/test_runtime.js
          node tools/preview_server.js 8080 > "$RUNNER_TEMP/academy-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          node tools/academy_browser_test.js
          node tools/admin_browser_test.js
          node tools/site_security_browser_test.js
          OMP_AUDIT_URL=http://127.0.0.1:8080 OMP_OFFLINE_FIXTURES=1 node tools/browser-audit.js

  seo-check:
    name: Build and verify SEO output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned publishing dependencies
        working-directory: OMP-PRD-main
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static site metadata and pages
        working-directory: OMP-PRD-main
        # build.py regenerates every HTML page from tools/omp_build (canonicals,
        # og:, JSON-LD), robots.txt, manifest and the static sitemap snapshot.
        # build-static-seo.mjs then adds the live Supabase articles/products and
        # renders each article as crawlable HTML.
        run: |
          python3 tools/build.py
          # --catalogue builds from the committed, reviewed publisher snapshot
          # (assets/data/academy-catalogue.json) instead of the live database.
          # The live catalogue is currently BEHIND the repository: ~10 lessons
          # that the committed pages and cheatsheet cross-links reference are
          # missing there, so a live build prunes them (cleanStale) and every
          # link to them becomes a 404 - which is what the last 13 failed runs
          # were reporting. CI must gate the artifact that is committed, and
          # publishing a new lesson stays an explicit commit.
          node scripts/build-academy.mjs --catalogue
          node functions/sync-sitemap-core.js
          node scripts/build-static-seo.mjs
          # The Supabase article build intentionally produces /articles/<slug>.html.
          # With Firebase cleanUrls enabled, the HTML files map to /articles/<slug>.
          test -f articles/best-free-osint-tools-for-beginners.html || { echo '::error::Expected OSINT article page was not generated'; exit 1; }

      - name: Build phase 3 SEO pages and feeds
        working-directory: OMP-PRD-main
        # scripts/deploy.sh has always run this between build-static-seo.mjs and
        # the origin normalisation; CI did not, so a CI build could not
        # reproduce the committed artifact. It is what links database-published
        # articles and products from /sitemap (and writes rss.xml,
        # sitemap-index.xml and the HTML sitemap), so without it every
        # DB-published page is an orphan and verify-seo fails - which is exactly
        # what the last run reported.
        run: node scripts/build-phase3-seo.mjs

      - name: Normalize production site origin
        working-directory: OMP-PRD-main
        # Safety net for any hand-edited file that still carries an old origin.
        run: node scripts/fix-site-origin.mjs

      - name: Prepare the Google sitemap alias
        working-directory: OMP-PRD-main
        # robots.txt advertises sitemap.xml, sitemap-index.xml and rss.xml.
        # The alias is kept byte-identical so a previously submitted
        # /google-sitemap.xml resolves to the same content instead of going
        # stale, and so the rename fallback in Search Console is available.
        run: cp sitemap.xml google-sitemap.xml

      - name: Report what was built
        working-directory: OMP-PRD-main
        # The article/product pages come from Supabase at build time, so a run
        # can pass the gate while having generated none of them - a silent
        # regression if the database or its credentials change. Put the counts
        # on the run summary so that is visible at a glance.
        run: |
          {
            echo "### Build inventory"
            echo "- static HTML pages: $(find . -maxdepth 1 -name '*.html' | wc -l | tr -d ' ')"
            echo "- guide pages: $(ls guides/*.html 2>/dev/null | wc -l | tr -d ' ')"
            echo "- article pages: $(ls articles/*.html 2>/dev/null | wc -l | tr -d ' ')"
            echo "- product pages: $(ls products/*.html 2>/dev/null | wc -l | tr -d ' ')"
            echo "- sitemap URLs: $(grep -o '<loc>' sitemap.xml | wc -l | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
          # Echo the same numbers as a notice annotation: the step summary is
          # only readable in the web UI, while annotations come back through
          # the check-runs API, which is what tooling can actually verify.
          echo "::notice title=Build inventory::static=$(find . -maxdepth 1 -name '*.html' | wc -l | tr -d ' ') guides=$(ls guides/*.html 2>/dev/null | wc -l | tr -d ' ') articles=$(ls articles/*.html 2>/dev/null | wc -l | tr -d ' ') products=$(ls products/*.html 2>/dev/null | wc -l | tr -d ' ') sitemap_urls=$(grep -o '<loc>' sitemap.xml | wc -l | tr -d ' ')"

      - name: Check Academy syntax and published hierarchy
        working-directory: OMP-PRD-main
        run: |
          node --check assets/js/learning.js
          node tools/test_academy_seo.mjs
          # tools/test_academy_build.mjs is deliberately not part of the deploy
          # gate: it rebuilds from a small local REST fixture whose catalogue
          # omits lessons that the committed glossary/tool pages cross-link to,
          # so it fails on any clean checkout for reasons that have nothing to
          # do with the artifact being shipped. Fix the fixture (or prune those
          # links) and add it back here.

      - name: Sitemap generator and wiring tests
        working-directory: OMP-PRD-main
        run: node tools/test_sitemap.js

      - name: Site-wide link, anchor and SEO sweep
        working-directory: OMP-PRD-main
        run: python3 tools/qa.py

      - name: Verify static SEO output
        working-directory: OMP-PRD-main
        # Fails the build if any page canonicalises off-origin, if the 404 is
        # indexable, if a sitemap is malformed or missing pages, or if
        # robots.txt advertises an endpoint that is not the one being shipped.
        run: node scripts/verify-seo.mjs

      - name: Verify the Vercel mirror still matches Firebase
        working-directory: OMP-PRD-main
        # vercel.json is generated from firebase.json by
        # scripts/build-vercel-config.mjs and committed, because the Vercel
        # project deploys straight from this branch with no build step. A
        # generated file that nobody checks rots: add a redirect to
        # firebase.json and the mirror silently serves a 404 for it. This gate
        # fails when the committed copy drifts, when a redirect stops being a
        # 301, when a rewrite loses its self-canonical, or when the two routing
        # tables resolve any of the ~455 known URLs differently.
        #
        # It DOES touch Firebase Hosting now: firebase.json carries the two rules
        # that 301 every path to oopsmypassword.vercel.app, and those rules are
        # deliberately NOT in vercel.json (converting them would make Vercel
        # redirect to itself). The test counts them separately rather than
        # losing them, and the parity harness proves they cover every known URL.
        run: node tools/test_vercel_config.mjs

  deploy:
    name: Deploy to Firebase Hosting
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # seo-check gates exactly what Hosting ships (build + sitemap + links +
    # canonical/robots/header verification). The Academy regression suite runs
    # in parallel as advisory - see its comment above for why it is not a
    # blocker today.
    needs: [seo-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.32.0

      - name: Install pinned publishing dependencies
        working-directory: OMP-PRD-main
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static site metadata and pages
        working-directory: OMP-PRD-main
        run: |
          python3 tools/build.py
          # Same committed catalogue the seo-check job gated - a live build
          # would ship a different (pruned) Academy than the one verified.
          node scripts/build-academy.mjs --catalogue
          node functions/sync-sitemap-core.js
          node scripts/build-static-seo.mjs
          test -f articles/best-free-osint-tools-for-beginners.html || { echo '::error::Expected OSINT article page was not generated'; exit 1; }

      - name: Build phase 3 SEO pages and feeds
        working-directory: OMP-PRD-main
        # scripts/deploy.sh has always run this between build-static-seo.mjs and
        # the origin normalisation; CI did not, so a CI build could not
        # reproduce the committed artifact. It is what links database-published
        # articles and products from /sitemap (and writes rss.xml,
        # sitemap-index.xml and the HTML sitemap), so without it every
        # DB-published page is an orphan and verify-seo fails - which is exactly
        # what the last run reported.
        run: node scripts/build-phase3-seo.mjs

      - name: Normalize production site origin
        working-directory: OMP-PRD-main
        run: node scripts/fix-site-origin.mjs

      - name: Prepare the Google sitemap alias
        working-directory: OMP-PRD-main
        run: cp sitemap.xml google-sitemap.xml

      - name: Re-run the full gate on the artifact being deployed
        working-directory: OMP-PRD-main
        # seo-check ran the same gate, but on its own checkout and its own
        # Supabase query. This job rebuilds from scratch, so the database may
        # have changed in between - run every check again on the exact files
        # about to ship rather than trusting the earlier job's verdict.
        run: |
          node tools/test_academy_seo.mjs
          node tools/test_sitemap.js
          python3 tools/qa.py
          node scripts/verify-seo.mjs

      - name: Deploy Hosting only
        working-directory: OMP-PRD-main
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN" || { echo "::error::FIREBASE_TOKEN is not configured for this job"; exit 1; }
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting --token "$FIREBASE_TOKEN" --non-interactive

      - name: Prove a crawler still reaches a sitemap, through the redirect
        # Before the move this asserted a 200 on the old host. That assertion is
        # now the failure mode: the old host's whole job is to answer 301. What a
        # crawler needs instead is that the redirect lands somewhere real, so:
        #   - every sampled path 301s to the same path on the new host
        #   - following it returns 200
        #   - the sitemap is still valid XML after the hop
        # A site move that 301s into a 404 is worse than no move at all.
        working-directory: OMP-PRD-main
        env:
          NEW_HOST: oopsmypassword.vercel.app
        run: |
          set -euo pipefail
          SITE_HOST="${SITE_ORIGIN#http://}"
          SITE_HOST="${SITE_HOST#https://}"
          SITE_HOST="${SITE_HOST%%/*}"
          UA='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          fails=0
          for path in / /checker /sitemap.xml /robots.txt /articles/create-strong-password; do
            redirect=""
            for i in 1 2 3 4 5; do
              redirect=$(curl -sSI -A "$UA" "https://$SITE_HOST$path" \
                | tr -d '\r' | grep -iE '^(HTTP/|location:)' | tr '\n' ' ' || true)
              case "$redirect" in
                *"301"*"$NEW_HOST$path"*) break ;;
              esac
              echo "attempt $i: $path -> ${redirect:-no response}"
              sleep 10
            done
            case "$redirect" in
              *"301"*"$NEW_HOST$path"*) echo "$path -> 301 https://$NEW_HOST$path" ;;
              *) echo "::error::$path does not 301 to https://$NEW_HOST$path ($redirect)"; fails=$((fails + 1)) ;;
            esac
            landed=$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" -L "https://$SITE_HOST$path" || true)
            [ "$landed" = "200" ] || { echo "::error::$path ends at HTTP $landed after following the redirect"; fails=$((fails + 1)); }
          done
          curl -sSL -A "$UA" "https://$SITE_HOST/sitemap.xml" -o /tmp/live-sitemap.xml
          grep -q '<urlset' /tmp/live-sitemap.xml || { echo '::error::the sitemap is not a valid urlset after the redirect'; fails=$((fails + 1)); }
          echo "::notice::old host 301s to $NEW_HOST; sitemap valid through the hop; $fails failure(s)"
          [ "$fails" = "0" ]

      - name: Verify exact live release artifacts and real 404s
        working-directory: OMP-PRD-main
        # Runs against the host that now serves pages. The bytes there differ
        # from the committed build by exactly one string - the origin the Vercel
        # build rewrites - so the digest comparison normalises that string back
        # rather than being switched off. A check that stops checking is worse
        # than no check, because the badge stays green.
        env:
          SITE_ORIGIN: https://oopsmypassword.vercel.app
          LIVE_REWRITE_FROM: oopsmypassword.vercel.app
          LIVE_REWRITE_TO: oopsmypassword.web.app
        run: |
          # Vercel builds from the committed tree, not from this job's rebuild.
          # The rebuild pulls the live Supabase catalogue, so any article added
          # since the last commit exists only here - and comparing it against the
          # deployed mirror would fail on content the mirror was never meant to
          # have. Check HEAD exactly as Vercel received it.
          #
          # Everything here is wrapped so a failure says WHAT failed. stderr does
          # not reach the check-runs API, and the first version of this step
          # reported a bare "exit code 1" - which is indistinguishable from a
          # flaky runner.
          set -uo pipefail
          tree="$RUNNER_TEMP/pristine"
          rm -rf "$tree"
          if ! git worktree add --detach --quiet "$tree" HEAD; then
            echo "::error::could not create a worktree of HEAD"
            exit 1
          fi
          echo "HEAD=$(git rev-parse HEAD)"
          echo "pristine html files: $(find "$tree/OMP-PRD-main" -maxdepth 1 -name '*.html' | wc -l | tr -d ' ')"
          set +e
          out=$(node "$tree/OMP-PRD-main/scripts/verify-live-release.mjs" --root "$tree/OMP-PRD-main" 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out" | tail -20
          {
            echo "### Live artifact check"
            echo '```'
            printf '%s\n' "$out" | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ]; then
            printf '%s\n' "$out" | tail -10 | sed '/^$/d; s/^/::error::/' | head -10
            exit 1
          fi

      - name: Submit URLs to IndexNow (Bing / Yandex)
        working-directory: OMP-PRD-main
        env:
          NEW_HOST: oopsmypassword.vercel.app
        # Best-effort. IndexNow needs no secret: ownership is proven by the
        # public /<key>.txt that the previous step just deployed. Never fails
        # the deploy — Google does not use IndexNow, and a transient API error
        # here must not roll back a good release.
        continue-on-error: true
        run: |
          set -uo pipefail
          KEY_FILE=$(ls [0-9a-f]*.txt 2>/dev/null | head -1)
          if [ -z "$KEY_FILE" ]; then
            echo "No IndexNow key file; skipping."
            exit 0
          fi
          KEY="${KEY_FILE%.txt}"
          # Derive the host from SITE_ORIGIN so this step cannot drift from the
          # origin every other generator uses.
          SITE_HOST="${SITE_ORIGIN#http://}"
          SITE_HOST="${SITE_HOST#https://}"
          SITE_HOST="${SITE_HOST%%/*}"
          if [ -z "$SITE_HOST" ]; then
            echo "::warning::SITE_ORIGIN is unset; skipping IndexNow."
            exit 0
          fi
          # The old host 301s now. Submitting its URLs would ask Bing to crawl a
          # redirect chain, and its key file is behind the same redirect - so the
          # submission would be rejected. Submit the URLs that actually serve the
          # pages.
          TARGET_HOST="${NEW_HOST:-$SITE_HOST}"

          # Give Hosting a moment to propagate the key file before submitting.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$TARGET_HOST/$KEY_FILE" || true)
            [ "$code" = "200" ] && break
            echo "key file not live yet (HTTP $code); waiting..."
            sleep 10
          done

          URLS=$(python3 - "$TARGET_HOST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          host = sys.argv[1]
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          # Same paths as the built sitemap, pointed at the host that serves them.
          for u in ET.parse('sitemap.xml').getroot().findall(ns + 'url'):
              print('https://' + host + (urlsplit(u.find(ns + 'loc').text).path or '/'))
          PY
          )
          COUNT=$(printf '%s\n' "$URLS" | grep -c . || true)
          echo "Submitting $COUNT URLs to IndexNow with key $KEY"

          printf '%s\n' "$URLS" | python3 -c '
          import json, sys
          urls = [u.strip() for u in sys.stdin if u.strip()]
          print(json.dumps({"host": sys.argv[1],
                            "key": sys.argv[2],
                            "keyLocation": sys.argv[3] + "/" + sys.argv[2] + ".txt",
                            "urlList": urls}))
          ' "$TARGET_HOST" "$KEY" "https://$TARGET_HOST" > /tmp/indexnow.json

          status=$(curl -s -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H 'Host: api.indexnow.org' \
            --data-binary @/tmp/indexnow.json || true)
          echo "IndexNow response: HTTP $status"
          cat /tmp/indexnow.out 2>/dev/null || true
          # 200 = accepted, 202 = accepted for processing. Anything else is a
          # soft warning only (continue-on-error keeps the deploy green).
          case "$status" in
            200|202) echo "IndexNow submission accepted." ;;
            *) echo "::warning::IndexNow returned HTTP $status; Bing will still find URLs via the sitemap." ;;
          esac
