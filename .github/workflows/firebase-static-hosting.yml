name: Deploy Firebase Hosting Static SEO

# NOTE: GitHub only reads workflows from .github/workflows at the *repository
# root*. A copy under OMP-PRD-main/.github/workflows/ is never executed — that
# is why the full build pipeline (build.py + origin normalization + sitemap
# regeneration) never ran and the site shipped with truncated sitemaps and
# canonicals pointing at a dead domain. Keep this file the single workflow.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  SUPABASE_URL: https://aeehfulikupskyrvcpzb.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_s3n2U32MNB4PvHx0GolyqA_wlkzD6eR
  SITE_ORIGIN: https://oopsmypassword.web.app
  # Retired apex domain. It does not resolve, so any canonical or sitemap URL
  # pointing at it keeps that page out of the index. Consumed by
  # scripts/verify-seo.mjs, which fails the deploy if it appears anywhere.
  LEGACY_ORIGIN: https://oopsmypassword.com

jobs:
  seo-check:
    name: Build and verify SEO output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build static site metadata and pages
        working-directory: OMP-PRD-main
        # build.py regenerates every HTML page from tools/omp_build (canonicals,
        # og:, JSON-LD), robots.txt, manifest and the static sitemap snapshot.
        # build-static-seo.mjs then adds the live Supabase articles/products and
        # renders each article as crawlable HTML.
        run: |
          python3 tools/build.py
          node scripts/build-static-seo.mjs

      - name: Normalize production site origin
        working-directory: OMP-PRD-main
        # Safety net for any hand-edited file that still carries an old origin.
        run: node scripts/fix-site-origin.mjs

      - name: Prepare the Google sitemap alias
        working-directory: OMP-PRD-main
        # robots.txt advertises /sitemap.xml only. The alias is kept as a
        # byte-identical copy so a previously submitted /google-sitemap.xml
        # keeps resolving to the same content instead of going stale.
        run: cp sitemap.xml google-sitemap.xml

      - name: Report what was built
        working-directory: OMP-PRD-main
        # The article/product pages come from Supabase at build time, so a run
        # can pass the gate while having generated none of them - a silent
        # regression if the database or its credentials change. Put the counts
        # on the run summary so that is visible at a glance.
        run: |
          {
            echo "### Build inventory"
            echo "- static HTML pages: $(find . -maxdepth 1 -name '*.html' | wc -l | tr -d ' ')"
            echo "- guide pages: $(ls guides/*.html 2>/dev/null | wc -l | tr -d ' ')"
            echo "- article pages: $(ls articles/*.html 2>/dev/null | wc -l | tr -d ' ')"
            echo "- product pages: $(ls products/*.html 2>/dev/null | wc -l | tr -d ' ')"
            echo "- sitemap URLs: $(grep -o '<loc>' sitemap.xml | wc -l | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
          # Echo the same numbers as a notice annotation: the step summary is
          # only readable in the web UI, while annotations come back through
          # the check-runs API, which is what tooling can actually verify.
          echo "::notice title=Build inventory::static=$(find . -maxdepth 1 -name '*.html' | wc -l | tr -d ' ') guides=$(ls guides/*.html 2>/dev/null | wc -l | tr -d ' ') articles=$(ls articles/*.html 2>/dev/null | wc -l | tr -d ' ') products=$(ls products/*.html 2>/dev/null | wc -l | tr -d ' ') sitemap_urls=$(grep -o '<loc>' sitemap.xml | wc -l | tr -d ' ')"

      - name: Sitemap generator and wiring tests
        working-directory: OMP-PRD-main
        run: node tools/test_sitemap.js

      - name: Site-wide link, anchor and SEO sweep
        working-directory: OMP-PRD-main
        run: python3 tools/qa.py

      - name: Verify static SEO output
        working-directory: OMP-PRD-main
        # Fails the build if any page canonicalises off-origin, if the 404 is
        # indexable, if a sitemap is malformed or missing pages, or if
        # robots.txt advertises an endpoint that is not the one being shipped.
        run: node scripts/verify-seo.mjs

  deploy:
    name: Deploy to Firebase Hosting
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: seo-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build static site metadata and pages
        working-directory: OMP-PRD-main
        run: |
          python3 tools/build.py
          node scripts/build-static-seo.mjs

      - name: Normalize production site origin
        working-directory: OMP-PRD-main
        run: node scripts/fix-site-origin.mjs

      - name: Prepare the Google sitemap alias
        working-directory: OMP-PRD-main
        run: cp sitemap.xml google-sitemap.xml

      - name: Re-run the full gate on the artifact being deployed
        working-directory: OMP-PRD-main
        # seo-check ran the same gate, but on its own checkout and its own
        # Supabase query. This job rebuilds from scratch, so the database may
        # have changed in between - run every check again on the exact files
        # about to ship rather than trusting the earlier job's verdict.
        run: |
          node tools/test_sitemap.js
          python3 tools/qa.py
          node scripts/verify-seo.mjs

      - name: Deploy Hosting only
        working-directory: OMP-PRD-main
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive

      - name: Submit URLs to IndexNow (Bing / Yandex)
        working-directory: OMP-PRD-main
        # Best-effort. IndexNow needs no secret: ownership is proven by the
        # public /<key>.txt that the previous step just deployed. Never fails
        # the deploy — Google does not use IndexNow, and a transient API error
        # here must not roll back a good release.
        continue-on-error: true
        run: |
          set -uo pipefail
          KEY_FILE=$(ls [0-9a-f]*.txt 2>/dev/null | head -1)
          if [ -z "$KEY_FILE" ]; then
            echo "No IndexNow key file; skipping."
            exit 0
          fi
          KEY="${KEY_FILE%.txt}"
          # Derive the host from SITE_ORIGIN so this step cannot drift from the
          # origin every other generator uses.
          SITE_HOST="${SITE_ORIGIN#http://}"
          SITE_HOST="${SITE_HOST#https://}"
          SITE_HOST="${SITE_HOST%%/*}"
          if [ -z "$SITE_HOST" ]; then
            echo "::warning::SITE_ORIGIN is unset; skipping IndexNow."
            exit 0
          fi

          # Give Hosting a moment to propagate the key file before submitting.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$SITE_HOST/$KEY_FILE" || true)
            [ "$code" = "200" ] && break
            echo "key file not live yet (HTTP $code); waiting..."
            sleep 10
          done

          URLS=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          print('\n'.join(u.find(ns + 'loc').text
                          for u in ET.parse('sitemap.xml').getroot().findall(ns + 'url')))
          PY
          )
          COUNT=$(printf '%s\n' "$URLS" | grep -c . || true)
          echo "Submitting $COUNT URLs to IndexNow with key $KEY"

          printf '%s\n' "$URLS" | python3 -c '
          import json, sys
          urls = [u.strip() for u in sys.stdin if u.strip()]
          print(json.dumps({"host": sys.argv[1],
                            "key": sys.argv[2],
                            "keyLocation": sys.argv[3] + "/" + sys.argv[2] + ".txt",
                            "urlList": urls}))
          ' "$SITE_HOST" "$KEY" "https://$SITE_HOST" > /tmp/indexnow.json

          status=$(curl -s -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H 'Host: api.indexnow.org' \
            --data-binary @/tmp/indexnow.json || true)
          echo "IndexNow response: HTTP $status"
          cat /tmp/indexnow.out 2>/dev/null || true
          # 200 = accepted, 202 = accepted for processing. Anything else is a
          # soft warning only (continue-on-error keeps the deploy green).
          case "$status" in
            200|202) echo "IndexNow submission accepted." ;;
            *) echo "::warning::IndexNow returned HTTP $status; Bing will still find URLs via the sitemap." ;;
          esac
