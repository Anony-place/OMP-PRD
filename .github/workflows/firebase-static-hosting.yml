name: Deploy Firebase Hosting Static SEO

# NOTE: GitHub only reads workflows from .github/workflows at the *repository
# root*. A copy under OMP-PRD-main/.github/workflows/ is never executed — that
# is why the full build pipeline (build.py + origin normalization + sitemap
# regeneration) never ran and the site shipped with truncated sitemaps and
# canonicals pointing at a dead domain. Keep this file the single workflow.

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

# Manual runs only. This workflow used to fire on every push and pull request,
# spending Actions minutes on every commit even when nothing needed deploying.
# Deploys now run through the Firebase CLI, which is free on the Spark plan, so
# the gate is opt-in: dispatch it from the Actions tab when you want the full
# regression suite before a deploy.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: https://aeehfulikupskyrvcpzb.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_s3n2U32MNB4PvHx0GolyqA_wlkzD6eR
  SITE_ORIGIN: https://oopsmypassword.web.app
  FIREBASE_PROJECT_ID: password-e9a30
  # Retired apex domain. It does not resolve, so any canonical or sitemap URL
  # pointing at it keeps that page out of the index. Consumed by
  # scripts/verify-seo.mjs, which fails the deploy if it appears anywhere.
  LEGACY_ORIGIN: https://oopsmypassword.com

jobs:
  seo-check:
    name: Build and verify SEO output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned publishing dependencies
        working-directory: OMP-PRD-main
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static site metadata and pages
        working-directory: OMP-PRD-main
        # build.py regenerates every HTML page from tools/omp_build (canonicals,
        # og:, JSON-LD), robots.txt, manifest and the static sitemap snapshot.
        # build-static-seo.mjs then adds the live Supabase articles/products and
        # renders each article as crawlable HTML.
        run: |
          python3 tools/build.py
          node functions/sync-sitemap-core.js
          node scripts/build-static-seo.mjs
          # The Supabase article build intentionally produces /articles/<slug>.html.
          # With Firebase cleanUrls enabled, the HTML files map to /articles/<slug>.
          test -f articles/best-free-osint-tools-for-beginners.html || { echo '::error::Expected OSINT article page was not generated'; exit 1; }

      - name: Build phase 3 SEO pages and feeds
        working-directory: OMP-PRD-main
        # scripts/deploy.sh has always run this between build-static-seo.mjs and
        # the origin normalisation; CI did not, so a CI build could not
        # reproduce the committed artifact. It is what links database-published
        # articles and products from /sitemap (and writes rss.xml,
        # sitemap-index.xml and the HTML sitemap), so without it every
        # DB-published page is an orphan and verify-seo fails - which is exactly
        # what the last run reported.
        run: |
          node scripts/build-phase3-seo.mjs
          # Indexes the pages just built so the search box can find them.
          node scripts/build-search-index.mjs

      - name: Normalize production site origin
        working-directory: OMP-PRD-main
        # Safety net for any hand-edited file that still carries an old origin.
        run: node scripts/fix-site-origin.mjs

      - name: Prepare the Google sitemap alias
        working-directory: OMP-PRD-main
        # robots.txt advertises sitemap.xml, sitemap-index.xml and rss.xml.
        # The alias is kept byte-identical so a previously submitted
        # /google-sitemap.xml resolves to the same content instead of going
        # stale, and so the rename fallback in Search Console is available.
        run: cp sitemap.xml google-sitemap.xml

      - name: Report what was built
        working-directory: OMP-PRD-main
        # The article/product pages come from Supabase at build time, so a run
        # can pass the gate while having generated none of them - a silent
        # regression if the database or its credentials change. Put the counts
        # on the run summary so that is visible at a glance.
        run: |
          {
            echo "### Build inventory"
            echo "- static HTML pages: $(find . -maxdepth 1 -name '*.html' | wc -l | tr -d ' ')"
            echo "- guide pages: $(ls guides/*.html 2>/dev/null | wc -l | tr -d ' ')"
            echo "- article pages: $(ls articles/*.html 2>/dev/null | wc -l | tr -d ' ')"
            echo "- product pages: $(ls products/*.html 2>/dev/null | wc -l | tr -d ' ')"
            echo "- sitemap URLs: $(grep -o '<loc>' sitemap.xml | wc -l | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
          # Echo the same numbers as a notice annotation: the step summary is
          # only readable in the web UI, while annotations come back through
          # the check-runs API, which is what tooling can actually verify.
          echo "::notice title=Build inventory::static=$(find . -maxdepth 1 -name '*.html' | wc -l | tr -d ' ') guides=$(ls guides/*.html 2>/dev/null | wc -l | tr -d ' ') articles=$(ls articles/*.html 2>/dev/null | wc -l | tr -d ' ') products=$(ls products/*.html 2>/dev/null | wc -l | tr -d ' ') sitemap_urls=$(grep -o '<loc>' sitemap.xml | wc -l | tr -d ' ')"


      - name: Sitemap generator and wiring tests
        working-directory: OMP-PRD-main
        run: node tools/test_sitemap.js

      - name: Install jsdom for the tool tests
        working-directory: OMP-PRD-main
        # Only jsdom is needed here - downloading the Playwright browsers would
        # add a minute to every run for a suite that parses and executes, but
        # never renders.
        run: |
          npm ci --prefix tools/qa-deps --no-audit --no-fund
          test -d tools/qa-deps/node_modules/jsdom || { echo '::error::jsdom did not install'; exit 1; }

      - name: Every tool actually works
        working-directory: OMP-PRD-main
        # The tools run in the browser, so nothing else in this workflow ever
        # executed one: the gates read HTML, and the markup was fine while a
        # button did nothing. This drives each tool the way a person does and
        # asserts the output is computed - two inputs must not produce the same
        # result, a generated value must change, and a failed breach lookup must
        # never be dressed up as "not found".
        run: node tools/test_tools_live.mjs

      - name: The tools can be used with a thumb
        working-directory: OMP-PRD-main
        # Three phone failures nobody sees on a desktop: a field under 16px
        # makes iOS zoom the page and leave it zoomed, a control under 44px is a
        # coin-flip to tap, and a min-width above the viewport is a horizontal
        # scrollbar. Reads the stylesheet and applies the cascade at 390px.
        run: node tools/test_mobile_ux.mjs

      - name: Every page can be found in search
        working-directory: OMP-PRD-main
        # The search box is the only way into 300+ pages, and its index used to
        # be hand-maintained: 9 published pages were unfindable by their own
        # titles. This fails when a page exists but search never learned of it.
        run: node tools/test_search_index.mjs

      - name: The mobile menu opens, closes and behaves
        working-directory: OMP-PRD-main
        # Escape, focus placement and a stale "Close menu" label are invisible
        # to a markup scan, so this drives the real page in jsdom on both the
        # marketing header and the Academy bar.
        run: node tools/test_mobile_nav.mjs
      - name: Every comparison is reachable
        working-directory: OMP-PRD-main
        # A comparison needs three edits in two files: the COMPARISONS entry, a
        # route in sitemap-core.mjs, and the build. Miss the route and the page
        # renders, links fine, and appears in no sitemap - no error, no traffic.
        run: node tools/test_comparisons_wired.mjs

      - name: The generator reads every column its template uses
        working-directory: OMP-PRD-main
        # The article template has always supported per-article SEO overrides;
        # the query never asked for the columns, so every override silently
        # resolved to undefined. Nothing failed - the pages were just not the
        # pages the panel said they were. This runs the real generator against
        # fixtures and fails if a field is read but not selected.
        run: node tools/test_static_build.mjs

      - name: Site-wide link, anchor and SEO sweep
        working-directory: OMP-PRD-main
        run: python3 tools/qa.py

      - name: Every content page has a way back
        working-directory: OMP-PRD-main
        # The reader arrives from a search result into a deep page. Only the
        # tool pages had a back control for a long time; this gate fails if any
        # generated family loses it again, or if the back-to-top and copy
        # controls fall out of main.js.
        run: node tools/test_navigation.mjs

      - name: Verify static SEO output
        working-directory: OMP-PRD-main
        # Fails the build if any page canonicalises off-origin, if the 404 is
        # indexable, if a sitemap is malformed or missing pages, or if
        # robots.txt advertises an endpoint that is not the one being shipped.
        run: node scripts/verify-seo.mjs

      - name: Preview and page render the same thing
        working-directory: OMP-PRD-main
        # The editor preview and the published page are two sanitizers with two
        # allowlists. They drifted once and the authors paid for it: <kbd>,
        # <mark> and <dl> looked right in the editor and were unwrapped on the
        # page. This fails the build when the two lists disagree, and checks the
        # SVG rules while it is there.
        run: node tools/test_richtext_parity.mjs

      - name: Install test engines (no browsers)
        working-directory: OMP-PRD-main
        # The revisions migration is checked against a real Postgres and the
        # autosave against a real DOM. Both engines are already pinned in
        # tools/qa-deps; --ignore-scripts skips the browser download that step
        # exists for in the other job. working-directory is not optional here:
        # this job has no repo-wide default, and the package lives under
        # OMP-PRD-main like the rest of the site.
        run: npm ci --prefix tools/qa-deps --ignore-scripts --no-audit --no-fund

      - name: Revisions are captured and restorable
        working-directory: OMP-PRD-main
        run: node tools/test_article_revisions.mjs

      - name: The publish pipeline cannot lie about a dry run or a failure
        working-directory: OMP-PRD-main
        # This is the one file nobody can run locally. A wrong `if:` there does
        # not fail a test, it pushes to main at 3am or records a failed build as
        # "nothing to do". Asserted here instead.
        run: node tools/test_publish_workflow.mjs

      - name: The test database describes the same table as production
        working-directory: OMP-PRD-main
        # The fixture used to have columns public.articles has never had, so
        # code written against it passed here and threw 42703 live - a save
        # trigger that broke every edit, and a column list no migration could
        # apply. Comparing the SQL, the fixture and the code is the only thing
        # that catches it before the first real save does.
        run: node tools/test_article_schema_parity.mjs

      - name: Every panel section renders, with data and without
        working-directory: OMP-PRD-main
        # Mounts all eleven sections in a real DOM against a fake Supabase, once
        # with rows and once against an empty database. The empty case is the
        # one that matters: a fresh install has no deploys, no redirects and no
        # subscribers, and that is exactly when somebody is looking at the
        # screen to find out why nothing works.
        run: node tools/test_admin_sections_render.mjs

      - name: Nobody can lock themselves out of the panel
        working-directory: OMP-PRD-main
        # Granting access is a function now, not a hand-written UPDATE: a missing
        # WHERE used to mean everyone, and the same statement the other way
        # removed the last admin. The test also asserts the change is recorded.
        run: node tools/test_admin_users.mjs

      - name: The subscriber list is admin-only
        working-directory: OMP-PRD-main
        # newsletter_subscribers is revoked from every browser role. The two
        # functions are the only door, and the checks are about the door: a
        # non-admin gets an error, an admin cannot confirm somebody on their
        # behalf, and unsubscribing cancels queued mail.
        run: node tools/test_newsletter_admin.mjs

      - name: Media cannot delete a file a page still uses
        working-directory: OMP-PRD-main
        run: node tools/test_media.mjs

      - name: Setup tells the truth about what is missing
        working-directory: OMP-PRD-main
        run: node tools/test_setup.mjs

      - name: A Word document cannot smuggle a link
        working-directory: OMP-PRD-main
        # Converts a real .docx with the vendored converter, then proves the
        # output only becomes safe after the article sanitizer - a javascript:
        # href in the document arrives intact and is removed there.
        run: node tools/test_docx_import.mjs

      - name: Who changed what is recorded
        working-directory: OMP-PRD-main
        run: node tools/test_audit_log.mjs

      - name: Categories cannot lose their articles
        working-directory: OMP-PRD-main
        run: node tools/test_categories.mjs

      - name: Autosave cannot overwrite newer work
        working-directory: OMP-PRD-main
        run: node tools/test_autosave.mjs

      - name: Every new table is granted, not just policied
        working-directory: OMP-PRD-main
        # A policy chooses rows; a grant allows the table. Tables created through
        # the Management API do not inherit the project's default privileges, so
        # a migration that writes a policy and stops leaves the table unreadable -
        # which reads on screen as "apply this migration", for a migration that
        # has been applied for days.
        run: node tools/test_api_grants.mjs

      - name: A failed publish says why, not "non-2xx"
        working-directory: OMP-PRD-main
        # supabase-js replaces the function's own explanation with one sentence
        # about HTTP. The body is where "GitHub rejected the dispatch (HTTP 403)"
        # lives, and that sentence is the difference between fixing a token and
        # pressing the button again.
        run: node tools/test_publish_errors.mjs

      - name: Panel settings cannot quietly change what a save does
        working-directory: OMP-PRD-main
        # The settings switch decides whether saving a published article starts
        # a deploy. A default that drifts to "published", or a switch that saves
        # but is never read, changes what one click does without changing a page.
        run: node tools/test_settings.mjs

      - name: Admin sections are wired
        working-directory: OMP-PRD-main
        # A tab with no mount is a blank screen, and a section that interpolates
        # a database value without escaping is an XSS in the admin. Both are
        # cheap to check and expensive to discover.
        run: node tools/test_admin_sections.mjs

      - name: Publishing from a terminal
        working-directory: OMP-PRD-main
        # scripts/new-article.mjs is the path code uses to publish. Its failures
        # are dry-run only: which title wins, what slug a title becomes, and
        # what it refuses to send.
        run: node tools/test_new_article.mjs

      - name: Verify the Vercel mirror still matches Firebase
        working-directory: OMP-PRD-main
        # vercel.json is generated from firebase.json by
        # scripts/build-vercel-config.mjs and committed, because the Vercel
        # project deploys straight from this branch with no build step. A
        # generated file that nobody checks rots: add a redirect to
        # firebase.json and the mirror silently serves a 404 for it. This gate
        # fails when the committed copy drifts, when a redirect stops being a
        # 301, when a rewrite loses its self-canonical, or when the two routing
        # tables resolve any of the ~455 known URLs differently.
        #
        # It DOES touch Firebase Hosting now: firebase.json carries the two rules
        # that 301 every path to oopsmypassword.vercel.app, and those rules are
        # deliberately NOT in vercel.json (converting them would make Vercel
        # redirect to itself). The test counts them separately rather than
        # losing them, and the parity harness proves they cover every known URL.
        run: node tools/test_vercel_config.mjs

  deploy:
    name: Deploy to Firebase Hosting
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # seo-check gates exactly what Hosting ships (build + sitemap + links +
    # canonical/robots/header verification). The Academy regression suite runs
    # in parallel as advisory - see its comment above for why it is not a
    # blocker today.
    needs: [seo-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the last step rebases the rebuilt pages over anything
          # pushed while the build ran, and a shallow clone cannot do that.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.32.0

      - name: Install pinned publishing dependencies
        working-directory: OMP-PRD-main
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static site metadata and pages
        working-directory: OMP-PRD-main
        run: |
          python3 tools/build.py
          node functions/sync-sitemap-core.js
          node scripts/build-static-seo.mjs
          test -f articles/best-free-osint-tools-for-beginners.html || { echo '::error::Expected OSINT article page was not generated'; exit 1; }

      - name: Build phase 3 SEO pages and feeds
        working-directory: OMP-PRD-main
        # scripts/deploy.sh has always run this between build-static-seo.mjs and
        # the origin normalisation; CI did not, so a CI build could not
        # reproduce the committed artifact. It is what links database-published
        # articles and products from /sitemap (and writes rss.xml,
        # sitemap-index.xml and the HTML sitemap), so without it every
        # DB-published page is an orphan and verify-seo fails - which is exactly
        # what the last run reported.
        run: |
          node scripts/build-phase3-seo.mjs
          # Indexes the pages just built so the search box can find them.
          node scripts/build-search-index.mjs

      - name: Normalize production site origin
        working-directory: OMP-PRD-main
        run: node scripts/fix-site-origin.mjs

      - name: Prepare the Google sitemap alias
        working-directory: OMP-PRD-main
        run: cp sitemap.xml google-sitemap.xml

      - name: Re-run the full gate on the artifact being deployed
        working-directory: OMP-PRD-main
        # seo-check ran the same gate, but on its own checkout and its own
        # Supabase query. This job rebuilds from scratch, so the database may
        # have changed in between - run every check again on the exact files
        # about to ship rather than trusting the earlier job's verdict.
        run: |
          node tools/test_sitemap.js
          python3 tools/qa.py
          node scripts/verify-seo.mjs

      - name: Deploy Hosting only
        working-directory: OMP-PRD-main
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN" || { echo "::error::FIREBASE_TOKEN is not configured for this job"; exit 1; }
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting --token "$FIREBASE_TOKEN" --non-interactive

      - name: Prove a crawler still reaches a sitemap, through the redirect
        # Before the move this asserted a 200 on the old host. That assertion is
        # now the failure mode: the old host's whole job is to answer 301. What a
        # crawler needs instead is that the redirect lands somewhere real, so:
        #   - every sampled path 301s to the same path on the new host
        #   - following it returns 200
        #   - the sitemap is still valid XML after the hop
        # A site move that 301s into a 404 is worse than no move at all.
        working-directory: OMP-PRD-main
        env:
          NEW_HOST: oopsmypassword.vercel.app
        run: |
          set -euo pipefail
          SITE_HOST="${SITE_ORIGIN#http://}"
          SITE_HOST="${SITE_HOST#https://}"
          SITE_HOST="${SITE_HOST%%/*}"
          UA='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          fails=0
          for path in / /checker /sitemap.xml /robots.txt /articles/create-strong-password; do
            redirect=""
            for i in 1 2 3 4 5; do
              redirect=$(curl -sSI -A "$UA" "https://$SITE_HOST$path" \
                | tr -d '\r' | grep -iE '^(HTTP/|location:)' | tr '\n' ' ' || true)
              case "$redirect" in
                *"301"*"$NEW_HOST$path"*) break ;;
              esac
              echo "attempt $i: $path -> ${redirect:-no response}"
              sleep 10
            done
            case "$redirect" in
              *"301"*"$NEW_HOST$path"*) echo "$path -> 301 https://$NEW_HOST$path" ;;
              *) echo "::error::$path does not 301 to https://$NEW_HOST$path ($redirect)"; fails=$((fails + 1)) ;;
            esac
            landed=$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" -L "https://$SITE_HOST$path" || true)
            [ "$landed" = "200" ] || { echo "::error::$path ends at HTTP $landed after following the redirect"; fails=$((fails + 1)); }
          done
          curl -sSL -A "$UA" "https://$SITE_HOST/sitemap.xml" -o /tmp/live-sitemap.xml
          grep -q '<urlset' /tmp/live-sitemap.xml || { echo '::error::the sitemap is not a valid urlset after the redirect'; fails=$((fails + 1)); }
          echo "::notice::old host 301s to $NEW_HOST; sitemap valid through the hop; $fails failure(s)"
          [ "$fails" = "0" ]

      - name: Verify exact live release artifacts and real 404s
        working-directory: OMP-PRD-main
        # Runs against the host that now serves pages. The bytes there differ
        # from the committed build by exactly one string - the origin the Vercel
        # build rewrites - so the digest comparison normalises that string back
        # rather than being switched off. A check that stops checking is worse
        # than no check, because the badge stays green.
        env:
          SITE_ORIGIN: https://oopsmypassword.vercel.app
          LIVE_REWRITE_FROM: oopsmypassword.vercel.app
          LIVE_REWRITE_TO: oopsmypassword.web.app
        run: |
          # Vercel builds from the committed tree, not from this job's rebuild.
          # The rebuild pulls the live Supabase catalogue, so any article added
          # since the last commit exists only here - and comparing it against the
          # deployed mirror would fail on content the mirror was never meant to
          # have. Check HEAD exactly as Vercel received it.
          #
          # Everything here is wrapped so a failure says WHAT failed. stderr does
          # not reach the check-runs API, and the first version of this step
          # reported a bare "exit code 1" - which is indistinguishable from a
          # flaky runner.
          set -uo pipefail
          tree="$RUNNER_TEMP/pristine"
          rm -rf "$tree"
          if ! git worktree add --detach --quiet "$tree" HEAD; then
            echo "::error::could not create a worktree of HEAD"
            exit 1
          fi
          echo "HEAD=$(git rev-parse HEAD)"
          echo "pristine html files: $(find "$tree/OMP-PRD-main" -maxdepth 1 -name '*.html' | wc -l | tr -d ' ')"
          set +e
          out=$(node "$tree/OMP-PRD-main/scripts/verify-live-release.mjs" --root "$tree/OMP-PRD-main" 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out" | tail -20
          {
            echo "### Live artifact check"
            echo '```'
            printf '%s\n' "$out" | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ]; then
            printf '%s\n' "$out" | tail -10 | sed '/^$/d; s/^/::error::/' | head -10
            exit 1
          fi

      - name: Submit URLs to IndexNow (Bing / Yandex)
        working-directory: OMP-PRD-main
        env:
          NEW_HOST: oopsmypassword.vercel.app
        # Best-effort. IndexNow needs no secret: ownership is proven by the
        # public /<key>.txt that the previous step just deployed. Never fails
        # the deploy — Google does not use IndexNow, and a transient API error
        # here must not roll back a good release.
        continue-on-error: true
        run: |
          set -uo pipefail
          KEY_FILE=$(ls [0-9a-f]*.txt 2>/dev/null | head -1)
          if [ -z "$KEY_FILE" ]; then
            echo "No IndexNow key file; skipping."
            exit 0
          fi
          KEY="${KEY_FILE%.txt}"
          # Derive the host from SITE_ORIGIN so this step cannot drift from the
          # origin every other generator uses.
          SITE_HOST="${SITE_ORIGIN#http://}"
          SITE_HOST="${SITE_HOST#https://}"
          SITE_HOST="${SITE_HOST%%/*}"
          if [ -z "$SITE_HOST" ]; then
            echo "::warning::SITE_ORIGIN is unset; skipping IndexNow."
            exit 0
          fi
          # The old host 301s now. Submitting its URLs would ask Bing to crawl a
          # redirect chain, and its key file is behind the same redirect - so the
          # submission would be rejected. Submit the URLs that actually serve the
          # pages.
          TARGET_HOST="${NEW_HOST:-$SITE_HOST}"

          # Give Hosting a moment to propagate the key file before submitting.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$TARGET_HOST/$KEY_FILE" || true)
            [ "$code" = "200" ] && break
            echo "key file not live yet (HTTP $code); waiting..."
            sleep 10
          done

          URLS=$(python3 - "$TARGET_HOST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          host = sys.argv[1]
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          # Same paths as the built sitemap, pointed at the host that serves them.
          for u in ET.parse('sitemap.xml').getroot().findall(ns + 'url'):
              print('https://' + host + (urlsplit(u.find(ns + 'loc').text).path or '/'))
          PY
          )
          COUNT=$(printf '%s\n' "$URLS" | grep -c . || true)
          echo "Submitting $COUNT URLs to IndexNow with key $KEY"

          printf '%s\n' "$URLS" | python3 -c '
          import json, sys
          urls = [u.strip() for u in sys.stdin if u.strip()]
          print(json.dumps({"host": sys.argv[1],
                            "key": sys.argv[2],
                            "keyLocation": sys.argv[3] + "/" + sys.argv[2] + ".txt",
                            "urlList": urls}))
          ' "$TARGET_HOST" "$KEY" "https://$TARGET_HOST" > /tmp/indexnow.json

          status=$(curl -s -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST "https://api.indexnow.org/indexnow" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H 'Host: api.indexnow.org' \
            --data-binary @/tmp/indexnow.json || true)
          echo "IndexNow response: HTTP $status"
          cat /tmp/indexnow.out 2>/dev/null || true
          # 200 = accepted, 202 = accepted for processing. Anything else is a
          # soft warning only (continue-on-error keeps the deploy green).
          case "$status" in
            200|202) echo "IndexNow submission accepted." ;;
            *) echo "::warning::IndexNow returned HTTP $status; Bing will still find URLs via the sitemap." ;;
          esac

      # ------------------------------------------------------------------
      # The serving host is Vercel, and Vercel builds from the committed tree -
      # it never runs build-static-seo.mjs. Firebase 301s every path to it.
      # So a page that only exists after a build (a new tool row, a re-rendered
      # FAQ section, a changed summary) goes live on Firebase and stays stale on
      # the host readers actually reach. That is not theoretical: six OSINT
      # pages sat in the database and in the sitemap with no way to open them
      # until #89 committed them by hand.
      #
      # This step closes the loop: whatever the build just rendered from the
      # database is committed back, so the committed tree converges with
      # Firebase. It does NOT converge Vercel on its own: this job pushes with
      # the workflow GITHUB_TOKEN, and GitHub never delivers push events made
      # with that token to GitHub Apps - so Vercel's git integration never sees
      # these commits (observed 2026-11-09: sync commit ed43ebc stayed
      # undeployed while 404ing pages sat in the tree). The deploy-hook step
      # after this one kicks Vercel when VERCEL_DEPLOY_HOOK is configured;
      # until then a sync commit only ships on the next user push to main.
      # It runs last, so every gate above has already approved the artifact,
      # and it stages only generated content - build.py also rewrites ~40
      # template files for unrelated reasons and those must not be swept in.
      # ------------------------------------------------------------------
      - name: Commit the rebuilt pages the serving host reads
        working-directory: OMP-PRD-main
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name "omp-bot"
          git config user.email "bot@oopsmypassword.invalid"

          # sitemap.html is the only static page that links every published
          # article. It was missing from this list, so every article the build
          # added after the last manual regeneration shipped with no inbound
          # internal link at all - two of them (exiftool-remove-all-metadata and
          # nist-password-guidelines-2026) were orphaned exactly that way in
          # a1c2a96. It is deterministic (no build timestamp), so it is safe to
          # commit on drift.
          # articles.html carries the noscript list of every published article -
          # the only crawlable index of them outside /sitemap - so it drifts the
          # same way sitemap.html does. Both are deterministic.
          git add articles products osint pentest compare cheatsheets glossary \
                  articles.html sitemap.html \
                  sitemap.xml sitemap.txt sitemap-index.xml google-sitemap.xml \
                  llms.txt llms-full.txt 2>/dev/null || true
          git add assets/data/search-index.json 2>/dev/null || true
          # rss.xml carries a build timestamp, so it would differ on every run
          # and turn "no drift" into a commit per deploy.
          git restore --staged rss.xml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No drift: the committed pages already match the database."
            exit 0
          fi

          echo "Drift found. Files that differ:"
          git diff --cached --name-only | head -40
          echo "total: $(git diff --cached --name-only | wc -l) file(s)"

          git commit -q -m "content: sync the served pages with the database" \
            -m "Rebuilt by .github/workflows/firebase-static-hosting.yml because the Vercel mirror serves committed HTML, not a build."

          for attempt in 1 2 3; do
            if git pull --rebase --autostash --quiet origin main && git push --quiet origin HEAD:main; then
              echo "Committed and pushed on attempt $attempt."
              exit 0
            fi
            echo "attempt $attempt did not land; retrying"
            sleep 5
          done
          echo "::warning::could not push the rebuilt pages; the next deploy will retry"

      - name: Kick the Vercel mirror so sync commits do not wait for a push
        # Vercel serves committed HTML (see vercel-build.sh), and it deploys
        # through its GitHub integration on push events. Those events never
        # fire for GITHUB_TOKEN pushes, so the sync commit above would sit
        # undeployed until the next human push to main. A Vercel Deploy Hook
        # closes the gap from inside this workflow: create one under
        # project Settings -> Git -> Deploy Hooks (branch: main) and store the
        # URL as the repository secret VERCEL_DEPLOY_HOOK. The value never
        # needs to pass through chat. Without the secret this step only says
        # so and exits cleanly.
        continue-on-error: true
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -uo pipefail
          if [ -z "${VERCEL_DEPLOY_HOOK}" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not configured; Vercel will serve the sync commit after the next push to main. Add a Vercel Deploy Hook to close this gap."
            exit 0
          fi
          if curl -fsS -X POST "${VERCEL_DEPLOY_HOOK}" >/dev/null; then
            echo "Vercel deploy hook pinged; it will build the latest committed tree."
          else
            echo "::warning::Vercel deploy hook ping failed; the sync commit stays undeployed until a push reaches Vercel's git integration."
          fi
