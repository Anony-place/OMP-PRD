name: Verify Vercel mirror

# oopsmypassword.web.app is being moved to oopsmypassword.vercel.app. This
# workflow is the standing proof that the move is behaving, and it is written to
# be valid on both sides of the switch:
#
#   before the 301   both hosts serve the site; headers and content must match
#   after the 301    web.app answers 301 to the same path on Vercel, and that
#                    path must actually serve a page
#
# It never writes to either host. It only reads them.
#
#   push to main      header, indexability and redirect-integrity checks
#   workflow_dispatch the same, on demand

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: vercel-mirror-${{ github.ref }}
  cancel-in-progress: true

env:
  MIRROR: https://oopsmypassword.vercel.app
  PROD: https://oopsmypassword.web.app

jobs:
  headers:
    name: Mirror serves the right bytes to a crawler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sitemap endpoints are fetchable
        run: |
          set -euo pipefail
          for endpoint in sitemap.txt sitemap.xml sitemap-index.xml google-sitemap.xml rss.xml robots.txt; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 "$MIRROR/$endpoint")
            echo "$endpoint -> $code"
            [ "$code" = "200" ] || { echo "::error::$endpoint returned $code, a crawler would see a broken sitemap"; exit 1; }
          done

      - name: Sitemap is self-consistent and points at this host
        run: |
          set -euo pipefail
          txt_urls=$(curl -sS "$MIRROR/sitemap.txt" | grep -c '^https://' || true)
          xml_urls=$(curl -sS "$MIRROR/sitemap.xml" | grep -c '<loc>' || true)
          echo "sitemap.txt=$txt_urls sitemap.xml=$xml_urls"
          [ "$txt_urls" = "$xml_urls" ] || { echo "::error::sitemap.txt has $txt_urls URLs but sitemap.xml has $xml_urls"; exit 1; }
          [ "$txt_urls" -gt 250 ] || { echo "::error::only $txt_urls URLs in the sitemap, expected the full set"; exit 1; }

          # A stale *.web.app URL here would ask Google to index the old host
          # from the new host's sitemap - the exact opposite of a migration.
          foreign=$(curl -sS "$MIRROR/sitemap.txt" | grep -c 'web\.app' || true)
          [ "$foreign" = "0" ] || { echo "::error::$foreign line(s) in the sitemap still point at web.app"; exit 1; }

      - name: Pages are indexable
        run: |
          set -euo pipefail
          # The inverse of the old check. While Vercel was a staging mirror a
          # host-scoped noindex kept it out of the index; the 301 now lands
          # here, so the same header would tell Google to drop every page it
          # was just redirected to.
          fails=0
          for page in / /checker /articles/create-strong-password /glossary; do
            headers=$(curl -sSI --retry 3 "$MIRROR$page")
            code=$(printf '%s' "$headers" | head -1)
            robots=$(printf '%s' "$headers" | grep -i '^x-robots-tag:' || true)
            echo "$page -> $code ${robots:-[no x-robots-tag]}"
            if printf '%s' "$robots" | grep -qi 'noindex'; then
              echo "::error::$page is noindexed - Google would drop the page it was redirected to"
              fails=$((fails + 1))
            fi
          done
          [ "$fails" = "0" ]

      - name: Canonicals point at this host
        run: |
          set -euo pipefail
          for page in / /checker; do
            canonical=$(curl -sS --retry 3 "$MIRROR$page" | grep -o '<link rel="canonical"[^>]*>' | head -1)
            echo "$page -> $canonical"
            case "$canonical" in
              *"https://oopsmypassword.vercel.app"*) ;;
              *) echo "::error::$page canonicalises somewhere other than this host: $canonical"; exit 1 ;;
            esac
          done
          echo "::notice::canonicals point at the Vercel origin"

      - name: Search Console verification tag is still served
        run: |
          set -euo pipefail
          # A URL-prefix property is verified by this meta tag on the home page.
          # If it disappears, Google re-checks ownership later and the property
          # silently loses Sitemaps and URL Inspection.
          #
          # Retried on purpose: a push triggers this workflow AND a Vercel
          # deployment at the same time, so for a few seconds the alias can
          # still serve the previous build.
          #
          # Matched with a bash `case`, not `grep -q`: grep exits as soon as it
          # matches, and with `set -o pipefail` a large page can turn that early
          # exit into a false failure.
          missing=""
          for attempt in 1 2 3 4 5; do
            home=$(curl -sS --retry 3 "$MIRROR/")
            missing=""
            present=0
            for token in MsDOM6JlqwnItZo1uJAFNYWAEkaDQPOJvzyfIIE9Vbg ilff-p9F52ymQPjAUhrWXMh2zidY67vxMIp0QskcbfY; do
              case "$home" in
                *"google-site-verification"*"$token"*) present=$((present + 1)) ;;
                *) missing="$missing $token" ;;
              esac
            done
            if [ -z "$missing" ]; then
              echo "both verification tags present (home page ${#home} bytes)"
              echo "::notice::Search Console verification tags present: ${present}/2, home page ${#home} bytes"
              exit 0
            fi
            echo "attempt ${attempt}: missing${missing} (home page ${#home} bytes)"
            [ "$attempt" = "5" ] || sleep 20
          done
          echo "::error::the home page does not carry the verification tag(s):${missing}"
          exit 1

      - name: No login wall in front of Googlebot
        run: |
          set -euo pipefail
          # Vercel Deployment Protection answers 401 with a www-authenticate
          # header - indistinguishable from a broken site to a crawler, and it
          # would quietly deindex the new host.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "$MIRROR/checker")
          [ "$code" = "200" ] || { echo "::error::GET /checker returned $code - Deployment Protection or the firewall is in the way"; exit 1; }

          googlebot_code=$(curl -sS -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' "$MIRROR/sitemap.txt")
          echo "googlebot UA -> $googlebot_code"
          [ "$googlebot_code" = "200" ] || { echo "::error::Googlebot user agent got $googlebot_code - bot protection is blocking the crawler"; exit 1; }

      - name: Routing behaves like the old host
        run: |
          set -euo pipefail
          read -r code location <<< "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$MIRROR/guides/create-strong-password")"
          echo "legacy guide -> $code $location"
          [ "$code" = "301" ] || { echo "::error::legacy /guides/ URL returned $code, expected 301"; exit 1; }
          printf '%s' "$location" | grep -q '/articles/create-strong-password' \
            || { echo "::error::legacy URL redirected to $location"; exit 1; }

          code=$(curl -sS -o /dev/null -w '%{http_code}' "$MIRROR/this-page-does-not-exist")
          echo "unknown path -> $code"
          [ "$code" = "404" ] || { echo "::error::unknown path returned $code, expected 404"; exit 1; }

  migration:
    name: Old host leads to the new one, path for path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Redirect integrity across a sample of real URLs
        run: |
          set -euo pipefail
          # Written to pass BEFORE and AFTER the 301 is switched on:
          #   before  web.app answers 200 for the page  -> counted as "served"
          #   after   web.app answers 301 to the same path on Vercel -> the
          #           destination must actually return 200, not a 404
          # A migration that redirects to a path nobody serves is worse than no
          # migration, and this is the check that catches it.
          mapfile -t paths < <(curl -sS "$MIRROR/sitemap.txt" | awk 'NR % 7 == 1' | sed "s|^$MIRROR||" | head -45)
          echo "sampling ${#paths[@]} URLs"

          redirects=0
          served=0
          failures=0

          for path in "${paths[@]}"; do
            [ -n "$path" ] || continue
            read -r code location <<< "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 25 "$PROD$path" || echo '000 ')"

            case "$code" in
              301|308)
                if [ "$location" != "$MIRROR$path" ]; then
                  echo "::error::$path redirected to $location, expected $MIRROR$path"
                  failures=$((failures + 1))
                  continue
                fi
                mcode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$MIRROR$path")
                if [ "$mcode" != "200" ]; then
                  echo "::error::$path redirected to a destination that answers $mcode"
                  failures=$((failures + 1))
                  continue
                fi
                redirects=$((redirects + 1))
                ;;
              200)
                served=$((served + 1))
                ;;
              *)
                echo "::error::$path answered $code on the old host"
                failures=$((failures + 1))
                ;;
            esac
          done

          echo "redirected=$redirects still-served=$served failures=$failures"
          echo "::notice::old host: $redirects redirected, $served still served, $failures failures"
          [ "$failures" = "0" ]
          [ $((redirects + served)) -gt 0 ]
